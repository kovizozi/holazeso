name: Cigánd-hírfigyelő

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: cigand-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hírek gyűjtése
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 .github/scripts/cigand_news.py
      - name: Kommit, ha változott
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain cigand-news.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
            git add cigand-news.json
            git commit -m "chore: Cigánd-hírek frissítése"
            git pull --rebase
            git push
            # A GITHUB_TOKEN-nel végzett push nem indítja el más workflow push-triggerét,
            # ezért a /cigand/ oldal újragenerálását kifejezetten kérjük.
            gh workflow run build-pages.yml
          fi
