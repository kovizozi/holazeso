<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>holazeso.hu — hol az eső?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="app">

    <!-- Helyszín-kereső: csak akkor látszik, ha még nincs elmentett település -->
    <section id="location-picker" hidden>
      <label for="location-input" class="label">Melyik településről van szó?</label>
      <form id="location-form">
        <input type="text" id="location-input" placeholder="pl. Kecskemét" autocomplete="off" required>
        <button type="submit">Mehet</button>
      </form>
      <p id="location-error" class="error" hidden></p>
    </section>

    <!-- Fő tartalom: csak akkor látszik, ha már van kiválasztott település -->
    <section id="result" hidden aria-live="polite">

      <div class="top">
        <div class="domain">holazeso.hu</div>
        <button id="change-location" class="link-btn" type="button">helyszín módosítása</button>
      </div>

      <div class="block hero-block">
        <p class="question" id="q1-question">hol az eső …?</p>
        <p class="answer" id="q1-answer">…</p>
        <p class="context" id="q1-context"></p>
      </div>

      <div class="block detail-block" id="q2-block" hidden>
        <p class="question" id="q2-question"></p>
        <div id="q2-answer"></div>
      </div>

    </section>

    <p id="loading" class="loading" hidden>töltés…</p>

  </main>

  <footer>
    Adatforrás: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0)
  </footer>

  <script src="script.js"></script>
</body>
</html>
